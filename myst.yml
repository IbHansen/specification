version: 1
project:
  id: modelflow-specification
  title: ModelFlow - Model Specification
  description: >-
    Supplement on specifying models in ModelFlow: the specification language,
    the %%Makemymodel Jupyter magic, estimation, equation normalization and
    add factors, an estimation example that builds, estimates and simulates a
    small model for Nepal, and differential equations.
  exports:
    - format: pdf
      template: latex/mfbook-template
      output: exports/pdf/specification.pdf
      articles: &chapters
        - intro.md
        - model specification.ipynb
        - jupyter_magic_makemymodel.ipynb
        - input formats.ipynb
        - estimation.ipynb
        - fixed periods.ipynb
        - normal.ipynb
        - add factors.ipynb
        - estimation example.ipynb
        - differential equations.ipynb
    - format: tex
      template: latex/mfbook-template
      output: exports/tex/specification.tex
      articles: *chapters
  toc:
    - file: intro.md
      title: Introduction
    - file: model specification.ipynb
      title: Model specification
    - file: jupyter_magic_makemymodel.ipynb
      title: The %%Makemymodel magic
    - file: input formats.ipynb
      title: Input formats
    - file: estimation.ipynb
      title: Estimation
    - file: fixed periods.ipynb
      title: Variables at a fixed period
    - file: normal.ipynb
      title: Normalization
    - file: add factors.ipynb
      title: Add factors
    - file: estimation example.ipynb
      title: Estimation example
    - file: differential equations.ipynb
      title: Differential equations
site:
  template: book-theme
  options:
    logo_text: Model specification
